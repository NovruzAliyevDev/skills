<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Queue Monitor</title>
<meta name="admin-token" content="">
<script src="/marked.min.js"></script>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --line: #e2e5ea; --text: #1d2330; --muted: #6a7282;
  --accent: #2f6fde; --ok: #1f8a4c; --bad: #c8382f; --warn: #b7791f; --idle: #8a919e;
  --code: #f0f2f5; --hover: #eef2fb; --sel: #e3ebfb;
  --frame: #3b4252; --shadow: rgba(29, 35, 48, .2);
  --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
  /* Scene surfaces; sprites read them when their cache is built. */
  --scene-ink: #2b2533; --scene-wall: #e9e3d6; --scene-wall-trim: #cbbfa6; --scene-ceiling: #d8cfbd;
  --scene-floor: #dcc6a2; --scene-floor-line: #cdb48c; --scene-wood: #b47c45; --scene-wood-dark: #855631;
  --scene-metal: #5d6474; --scene-metal-light: #8d95a5; --scene-screen: #79d2ef; --scene-screen-line: #3a9fc4;
  --scene-sky: #c4e6f8; --scene-cloud: #ffffff; --scene-leaf: #5aa05e; --scene-leaf-dark: #3f7d45; --scene-pot: #bb6a40;
  --scene-rug: #cfe7d2; --scene-rug-edge: #8fc69c; --scene-alert-floor: #f1d2cc; --scene-hazard: #f0c23e;
  --scene-trousers: #3c4250;
  /* Parallel groups' marks, one colour per group in the run's order. */
  --scene-group-0: #8a4fd6; --scene-group-1: #d4691c; --scene-group-2: #148f96; --scene-group-3: #c2347f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171c; --panel: #1b1f26; --line: #2c323c; --text: #e3e7ee; --muted: #9098a6;
    --accent: #6c9cf0; --ok: #46b97a; --bad: #ec6a60; --warn: #e0a64a; --idle: #7c8492;
    --code: #232833; --hover: #222833; --sel: #26324a;
    --frame: #59627a; --shadow: rgba(0, 0, 0, .45);
    --scene-ink: #141118; --scene-wall: #353b4b; --scene-wall-trim: #4c5569; --scene-ceiling: #2b303d;
    --scene-floor: #54473b; --scene-floor-line: #463b31; --scene-wood: #8c5d37; --scene-wood-dark: #613e25;
    --scene-metal: #4a5162; --scene-metal-light: #737c90; --scene-screen: #4fb4db; --scene-screen-line: #2d81a6;
    --scene-sky: #1f2b4e; --scene-cloud: #d6deee; --scene-leaf: #4a8b50; --scene-leaf-dark: #33643a; --scene-pot: #9b5636;
    --scene-rug: #2f4a3b; --scene-rug-edge: #4d7b5d; --scene-alert-floor: #4f2c2c; --scene-hazard: #d9ac2d;
    --scene-trousers: #5b647c;
    --scene-group-0: #b08cf0; --scene-group-1: #f0a057; --scene-group-2: #4fc8cf; --scene-group-3: #ec7ab8;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
/* A page scrollbar coming and going must not change the scene's width, or its scale would flip back and forth. */
html { scrollbar-gutter: stable; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Pixel chrome: square corners, 2 px borders, stepped block shadows, monospace uppercase headings and badges. */
h1, h2, .badge, .sign, .btn, .counter, [role="tab"], .section > summary, .previous > summary, .done-list p, .session-sep {
  font-family: var(--mono); text-transform: uppercase; letter-spacing: .05em; }
button { font: inherit; color: inherit; }
.badge { display: inline-block; padding: 1px 6px; font-size: 11px; font-weight: 700; border: 2px solid rgba(0, 0, 0, .22); white-space: nowrap; }
.badge, .sign { color: #fff; background: var(--idle); }
.s-running { background: var(--accent); }
.s-done { background: var(--ok); }
.s-failed, .s-stopped, .s-preflight-failed { background: var(--bad); }
.s-interrupted, .s-no-session, .s-paused { background: var(--warn); }
.s-pausing { background: var(--accent); }
/* A skipped task is grey, as a pending one, with a dashed edge; a queue finished with skips is not "DONE". */
.s-skipped { border-style: dashed; border-color: rgba(0, 0, 0, .35); }
.s-finished-with-skips { background: var(--ok); }
.muted { color: var(--muted); }
.empty { color: var(--muted); font-style: italic; }
.btn { padding: 3px 10px; font-size: 11px; font-weight: 700; cursor: pointer; background: var(--panel); border: 2px solid var(--frame); box-shadow: 2px 2px 0 var(--shadow); }
.btn:hover { background: var(--hover); }

.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: 100vh; }
aside { background: var(--panel); border-right: 2px solid var(--frame); padding: 14px 0; overflow-y: auto; max-height: 100vh; position: sticky; top: 0; }
aside h1 { font-size: 14px; margin: 0 16px 4px; }
.root { color: var(--muted); font-size: 12px; margin: 0 16px 12px; word-break: break-all; }
.notify-btn { margin: 0 16px 12px; }
.runs { display: grid; gap: 6px; padding: 0 12px; }
.run-item { display: block; width: 100%; text-align: left; padding: 7px 10px; cursor: pointer; background: var(--panel);
  border: 2px solid var(--line); box-shadow: 2px 2px 0 var(--shadow); }
.run-item:hover { background: var(--hover); }
.run-item[aria-current="true"] { background: var(--sel); border-color: var(--accent); box-shadow: 2px 2px 0 var(--shadow), 4px 4px 0 var(--shadow); }
.run-item .name { display: block; font-weight: 600; overflow-wrap: anywhere; }
.run-item .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 12px; margin-top: 2px; }

main { padding: 16px 20px 40px; min-width: 0; }
.panel { background: var(--panel); border: 2px solid var(--frame); padding: 12px 14px; margin-bottom: 16px;
  box-shadow: 2px 2px 0 var(--shadow), 4px 4px 0 var(--shadow); }
.panel h2 { font-size: 13px; margin: 0 0 10px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.panel h2 .muted, .section > summary .muted { text-transform: none; letter-spacing: 0; font-weight: 500; }
.offline { position: sticky; top: 0; z-index: 5; margin-bottom: 16px; padding: 8px 12px; font: 700 12px/1.4 var(--mono); color: #fff;
  background: var(--bad); border: 2px solid var(--frame); box-shadow: 2px 2px 0 var(--shadow), 4px 4px 0 var(--shadow); }
.offline:empty { display: none; }

/* The run header. Project and run keep their case: they are names. */
.panel .run-title { font-size: 15px; margin: 0 0 8px; align-items: center; text-transform: none; letter-spacing: 0; }
.run-facts { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--muted); font-size: 13px; }
.run-facts + .run-facts { margin-top: 4px; }
.run-facts b { color: var(--text); font-weight: 600; overflow-wrap: anywhere; }
.warning { color: var(--warn); font-size: 13px; font-weight: 600; margin-top: 6px; }
/* Queue controls under the run header. An action not allowed now stays in the Tab order, greyed. */
.run-controls { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 2px solid var(--line); }
.control-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
.btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; box-shadow: none; }
.btn[aria-disabled="true"]:hover { background: var(--panel); }
.btn[aria-disabled="true"]:active { transform: none; }
.admin-msg { margin: 0; color: var(--bad); font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
.admin-msg:empty { display: none; }

/* Collapsible run sections. */
.section { padding: 0; }
.section > summary { display: flex; gap: 8px; align-items: baseline; padding: 10px 14px; font-size: 13px; font-weight: 700; cursor: pointer; list-style: none; }
.section > summary::-webkit-details-marker { display: none; }
.section > summary::before { content: "+"; }
.section[open] > summary::before { content: "-"; }
.section-body { padding: 0 14px 12px; }
.commit { display: grid; grid-template-columns: 76px 150px minmax(0, 1fr); gap: 8px; padding: 3px 0; font-size: 13px; }
.commit .hash { font-family: var(--mono); color: var(--accent); }
.commit .ref { color: var(--muted); font-size: 12px; }
pre.plain { margin: 0; max-height: 50vh; overflow: auto; padding: 8px 10px; background: var(--code); border: 2px solid var(--line); font: 12px/1.45 var(--mono); }

/* The office: a canvas drawn at world resolution and scaled by an integer factor, with a DOM overlay on top. */
.scene { overflow-x: auto; }
.stage { position: relative; margin: 0 auto; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: crisp-edges; image-rendering: pixelated; pointer-events: none; }
/* The signs on the wall: the run state, and a row of merge signs under it, one per parallel group. */
.signs { position: absolute; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; }
.merge-signs { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
.sign { padding: 3px 8px; font-size: max(10px, calc(var(--px) * 3.5px)); line-height: 1.2;
  font-weight: 700; border: 2px solid var(--frame); box-shadow: 2px 2px 0 var(--shadow); white-space: nowrap; }
/* A merge sign is a button with its group's colour on its left edge; its state is its colour and its text. */
.sign.merge-sign { padding: 1px 6px; font: 700 clamp(9px, calc(var(--px) * 3px), 12px)/1.2 var(--mono); cursor: pointer;
  border-left: 5px solid var(--group); }
.merge-sign:hover { filter: brightness(1.1); }
.merge-sign.open { outline: 2px solid var(--accent); outline-offset: 1px; }
.m-merging { background: var(--accent); }
.m-resolving { background: var(--warn); }
.m-merged { background: var(--ok); }
.m-failed { background: var(--bad); }
/* Name tags and the "+N" counters: small DOM text that grows with the scene, within readable bounds. */
.tag, .counter, .helpers-more { font: 600 clamp(9px, calc(var(--px) * 3.4px), 13px)/1.2 var(--mono); }
/* A name tag never cuts its number; the title gets what room is left. */
.tag { position: absolute; display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: .4em; min-width: min-content;
  transform: translate(-50%, -100%); padding: 0 2px;
  background: var(--panel); color: var(--text); border: 2px solid var(--frame); white-space: nowrap; pointer-events: none; }
.tag span { overflow: hidden; text-overflow: ellipsis; }
.tag.open { background: var(--accent); color: #fff; }
/* A parallel group's worker: its name tag is framed in the group's colour. */
.tag.grouped { border-color: var(--group); box-shadow: inset 0 -2px 0 var(--group); }
/* A skipped task's tag, and the tag of one marked to be skipped, are greyed like its desk or figure. */
.tag.skipped { color: var(--muted); border-color: var(--line); border-style: dashed; }
.tag.skipped.open { color: #fff; }
.worker { position: absolute; padding: 0; margin: 0; border: 0; background: transparent; cursor: pointer; }
/* Helpers have a hover target over each sprite, and a "+N" marker for those not drawn; neither is in the Tab order. */
.helper { position: absolute; cursor: pointer; }
.counter, .helpers-more { position: absolute; padding: 1px 5px; font-weight: 700; white-space: nowrap; cursor: pointer;
  background: var(--panel); color: var(--text); border: 2px solid var(--frame); box-shadow: 2px 2px 0 var(--shadow); }
.counter:hover { background: var(--hover); }
.counter.open, .counter[aria-expanded="true"] { background: var(--sel); border-color: var(--accent); }
/* A pressed pixel button sinks into its shadow. */
.btn:active, .run-item:active, .counter:active, .merge-sign:active { transform: translate(2px, 2px); box-shadow: none; }

/* Floating boxes over the page: the tooltip and the "+N done" list. */
.tip, .done-list { position: fixed; background: var(--panel); color: var(--text); border: 2px solid var(--frame);
  box-shadow: 2px 2px 0 var(--shadow), 4px 4px 0 var(--shadow); }
.tip { z-index: 40; max-width: min(320px, calc(100vw - 16px)); padding: 6px 9px 7px; font-size: 12px; line-height: 1.4; }
.tip p { margin: 0 0 4px; }
.tip p:last-child { margin-bottom: 0; }
.tip-list { margin: 4px 0 0; padding-left: 16px; }
.tip-title { font-weight: 600; overflow-wrap: anywhere; }
.tip-title b, .drawer-title b { font-family: var(--mono); }
.task-facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 1px 10px; margin: 6px 0 0; }
.task-facts div { display: contents; }
.task-facts dt { color: var(--muted); }
.task-facts dd { margin: 0; overflow-wrap: anywhere; }
.note { margin: 6px 0 0; color: var(--warn); font-weight: 600; }
.done-list { z-index: 35; width: min(380px, calc(100vw - 16px)); max-height: min(320px, 60vh); overflow-y: auto; padding: 6px; }
.done-list p { margin: 2px 4px 6px; font-size: 11px; font-weight: 700; color: var(--muted); }
.done-list ul { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
.done-list button { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 10px; width: 100%; padding: 4px 6px;
  text-align: left; font-size: 12px; cursor: pointer; background: transparent; border: 2px solid transparent; }
.done-list button:hover { background: var(--hover); }
.done-list button[aria-current="true"] { background: var(--sel); border-color: var(--accent); }
.done-list b { font-family: var(--mono); }
.done-list .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.done-list .num { color: var(--muted); font-variant-numeric: tabular-nums; }

/* The task drawer: a third column on wide screens. Below 1200 px it takes the run list's place, so the
   office stays in view beside it, and on a phone it covers the screen. */
.layout.drawer-open { grid-template-columns: 290px minmax(0, 1fr) clamp(340px, 30vw, 560px); }
.drawer { position: sticky; top: 0; height: 100vh; min-width: 0; display: flex; flex-direction: column;
  background: var(--panel); border-left: 2px solid var(--frame); }
.drawer:focus { outline: none; }
.drawer-head { padding: 12px 14px 10px; }
.drawer-bar { display: flex; gap: 10px; align-items: flex-start; }
.drawer-title { flex: 1; margin: 0; font-size: 14px; line-height: 1.5; text-transform: none; letter-spacing: 0; overflow-wrap: anywhere; }
.drawer-title .badge { vertical-align: 1px; }
.drawer-close { flex: none; width: 28px; height: 28px; padding: 0; font-size: 16px; line-height: 1; }
.drawer .task-facts { display: flex; flex-wrap: wrap; gap: 2px 16px; font-size: 13px; }
.drawer .task-facts div { display: flex; gap: 6px; }
/* The task's actions, under its facts: only those the run answer allows now. */
.task-actions { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-top: 8px; }
.skip-note { margin: 6px 0 0; color: var(--muted); font-size: 13px; font-weight: 600; }
/* The retry form: the mode, an optional note, and its own Retry and Cancel. */
.retry-form { display: grid; gap: 6px; margin-top: 8px; padding: 8px 10px; border: 2px solid var(--frame); background: var(--bg); }
.retry-form fieldset { display: grid; gap: 2px; margin: 0; padding: 0; border: 0; min-width: 0; }
.retry-form legend { padding: 0; margin-bottom: 4px; font: 700 11px/1.4 var(--mono); text-transform: uppercase; letter-spacing: .05em; }
.retry-mode { display: flex; gap: 6px; align-items: baseline; font-size: 13px; cursor: pointer; }
.retry-note-label { font-size: 13px; font-weight: 600; }
.retry-form textarea { width: 100%; min-height: 4.5em; resize: vertical; padding: 4px 6px; font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
  color: var(--text); background: var(--panel); border: 2px solid var(--frame); }
.retry-hint { margin: 0; font-size: 12px; }

/* The confirmation dialog, in the page's pixel style. */
.confirm { max-width: min(420px, calc(100vw - 32px)); padding: 14px 16px; color: var(--text); background: var(--panel);
  border: 2px solid var(--frame); box-shadow: 2px 2px 0 var(--shadow), 4px 4px 0 var(--shadow); }
.confirm::backdrop { background: rgba(0, 0, 0, .35); }
.confirm h2 { margin: 0 0 8px; font-size: 13px; }
.confirm p { margin: 0 0 12px; overflow-wrap: anywhere; }
.confirm-buttons { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
.btn.danger { color: #fff; background: var(--bad); border-color: var(--frame); }
.btn.danger:hover { filter: brightness(1.1); }
.btn.danger[aria-disabled="true"], .btn.danger[aria-disabled="true"]:hover { background: var(--bad); filter: none; }
.tabs { display: flex; gap: 6px; padding: 0 14px; border-bottom: 2px solid var(--frame); }
.tabs [role="tab"] { margin-bottom: -2px; padding: 4px 10px; font-size: 11px; font-weight: 700; cursor: pointer;
  color: var(--muted); background: var(--bg); border: 2px solid var(--frame); }
.tabs [role="tab"][aria-selected="true"] { color: var(--text); background: var(--panel); border-bottom-color: var(--panel); }
.tab-panel { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 10px 14px 16px; }
.previous { margin-top: 12px; border-top: 2px solid var(--line); padding-top: 8px; }
.previous > summary { cursor: pointer; font-size: 12px; font-weight: 700; }

/* Activity, reports and briefs: long text in the system font. */
.feed { font-size: 13px; }
.item { padding: 4px 0; border-bottom: 1px dashed var(--line); }
.item:last-child { border-bottom: 0; }
.item .ts { color: var(--muted); font-size: 11px; margin-right: 6px; font-family: var(--mono); }
.tool { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.tool .name { color: var(--accent); font-weight: 600; }
.session-sep { color: var(--muted); font-size: 11px; font-weight: 700; padding: 8px 0 4px; }
.result-item { border-left: 3px solid var(--ok); padding-left: 10px; margin: 6px 0; }
.result-item.error { border-left-color: var(--bad); }
details.agent { margin: 4px 0 4px 14px; border-left: 2px solid var(--line); padding-left: 10px; }
details.agent > summary { cursor: pointer; font-size: 12px; color: var(--muted); }
.md { overflow-wrap: anywhere; }
.md p { margin: 4px 0; }
.md pre { background: var(--code); padding: 8px 10px; overflow-x: auto; font-size: 12px; }
.md code { font-family: var(--mono); font-size: 12px; background: var(--code); padding: 1px 4px; }
.md pre code { padding: 0; background: none; }
.md table { border-collapse: collapse; margin: 6px 0; }
.md th, .md td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.md th { color: var(--muted); font-weight: 500; font-size: 12px; }
.md h1, .md h2, .md h3 { font: 600 15px/1.3 "Segoe UI", system-ui, sans-serif; text-transform: none; letter-spacing: 0; margin: 12px 0 6px; }
.md img { max-width: 100%; }

@media (max-width: 1199px) {
  .layout.drawer-open { grid-template-columns: minmax(0, 1fr) clamp(340px, 40vw, 440px); }
  .layout.drawer-open > aside { display: none; }
}
@media (max-width: 760px) {
  .layout, .layout.drawer-open { grid-template-columns: minmax(0, 1fr); }
  aside, .layout.drawer-open > aside { display: block; position: static; max-height: none; border-right: 0; border-bottom: 2px solid var(--frame); }
  main { padding: 12px 16px 32px; }
  .scene-panel { padding: 10px 0; }
  .scene-panel h2 { margin: 0 12px 10px; }
  .commit { grid-template-columns: 70px minmax(0, 1fr); }
  .commit .date { display: none; }
  .drawer { position: fixed; inset: 0; z-index: 30; height: auto; border-left: 0; }
}
</style>
<script type="module" src="/pixel/main.js"></script>
</head>
<body>
<div class="layout" id="layout">
  <aside>
    <h1>Task queues</h1>
    <div class="root" id="root"></div>
    <button type="button" class="btn notify-btn" id="notify-btn" hidden>Enable notifications</button>
    <nav class="runs" id="runs" aria-label="Runs"></nav>
  </aside>
  <main>
    <div class="offline" id="offline" role="status"></div>
    <section class="panel" aria-label="Run">
      <div id="head"><p class="empty">Select a run.</p></div>
      <div class="run-controls" id="run-controls" hidden>
        <div class="control-buttons" id="control-buttons" role="group" aria-label="Queue controls"></div>
        <p class="admin-msg" id="admin-msg" role="status"></p>
      </div>
    </section>
    <section class="panel scene-panel" aria-labelledby="scene-title">
      <h2 id="scene-title">Office</h2>
      <div class="scene" id="scene"></div>
    </section>
    <details class="panel section">
      <summary>Commits during the run <span class="muted" id="commits-note"></span></summary>
      <div class="section-body" id="commits"></div>
    </details>
    <details class="panel section">
      <summary>progress.log <span class="muted" id="progress-note"></span></summary>
      <div class="section-body"><pre class="plain" id="progress"></pre></div>
    </details>
  </main>
  <section class="drawer" id="drawer" role="dialog" aria-labelledby="drawer-title" tabindex="-1" hidden>
    <div class="drawer-head">
      <div class="drawer-bar">
        <h2 class="drawer-title" id="drawer-title"></h2>
        <button type="button" class="btn drawer-close" aria-label="Close">&times;</button>
      </div>
      <div class="drawer-facts"></div>
      <div class="task-actions" hidden>
        <div class="control-buttons" role="group" aria-label="Task actions"></div>
        <p class="admin-msg" role="status"></p>
      </div>
      <form class="retry-form" id="retry-form" aria-labelledby="retry-legend" hidden>
        <fieldset>
          <legend id="retry-legend">Retry the task</legend>
          <label class="retry-mode" data-mode="resume"><input type="radio" name="retry-mode" value="resume"> Resume its last session</label>
          <label class="retry-mode" data-mode="fresh"><input type="radio" name="retry-mode" value="fresh"> Start from scratch, in a new session</label>
        </fieldset>
        <label class="retry-note-label" for="retry-note">Note for the session <span class="muted">(optional)</span></label>
        <textarea id="retry-note" rows="3" maxlength="4000" aria-describedby="retry-hint"></textarea>
        <p class="retry-hint muted" id="retry-hint"></p>
        <div class="control-buttons">
          <button type="submit" class="btn">Retry task</button>
          <button type="button" class="btn retry-cancel">Cancel</button>
        </div>
        <p class="admin-msg" role="status"></p>
      </form>
    </div>
    <div class="tabs" role="tablist" aria-label="Task">
      <button type="button" role="tab" id="tab-activity" data-tab="activity" aria-controls="panel-activity" aria-selected="true">Activity</button>
      <button type="button" role="tab" id="tab-report" data-tab="report" aria-controls="panel-report" aria-selected="false" tabindex="-1">Report</button>
      <button type="button" role="tab" id="tab-brief" data-tab="brief" aria-controls="panel-brief" aria-selected="false" tabindex="-1">Brief</button>
    </div>
    <div class="tab-panel feed" id="panel-activity" role="tabpanel" aria-labelledby="tab-activity" tabindex="0"></div>
    <div class="tab-panel" id="panel-report" role="tabpanel" aria-labelledby="tab-report" tabindex="0" hidden></div>
    <div class="tab-panel" id="panel-brief" role="tabpanel" aria-labelledby="tab-brief" tabindex="0" hidden></div>
  </section>
  <dialog class="confirm" id="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-text">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text"></p>
      <div class="confirm-buttons">
        <button type="submit" class="btn" value="cancel" autofocus>Cancel</button>
        <button type="submit" class="btn danger" value="ok" id="confirm-ok"></button>
      </div>
    </form>
  </dialog>
</div>
</body>
</html>
